name: adept-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-adept}"
      POSTGRES_USER: "${POSTGRES_USER:-adept}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [adept]
    logging: *default-logging

  api:
    image: "${API_IMAGE:?Set API_IMAGE to an immutable sha-full-commit tag}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker,production
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-adept}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-adept}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      DB_MAX_POOL_SIZE: "${DB_MAX_POOL_SIZE:-10}"
      DB_MIN_IDLE: "${DB_MIN_IDLE:-2}"
      APP_FRONTEND_BASE_URL: "https://${ADEPT_DOMAIN:?Set ADEPT_DOMAIN}"
      APP_PUBLIC_API_BASE_URL: "https://${ADEPT_DOMAIN:?Set ADEPT_DOMAIN}"
      APP_ENGINE_BASE_URL: http://engine-api:8000
      APP_EMAIL_FROM: "${APP_EMAIL_FROM:?Set APP_EMAIL_FROM}"
      APP_JWT_SECRET_BASE64: "${APP_JWT_SECRET_BASE64:?Set APP_JWT_SECRET_BASE64}"
      APP_TOKEN_HASH_PEPPER_BASE64: "${APP_TOKEN_HASH_PEPPER_BASE64:?Set APP_TOKEN_HASH_PEPPER_BASE64}"
      APP_INTEGRATION_ENCRYPTION_ACTIVE_KEY_VERSION: "${APP_INTEGRATION_ENCRYPTION_ACTIVE_KEY_VERSION:-1}"
      APP_INTEGRATION_ENCRYPTION_KEY_V1_BASE64: "${APP_INTEGRATION_ENCRYPTION_KEY_V1_BASE64:?Set APP_INTEGRATION_ENCRYPTION_KEY_V1_BASE64}"
      APP_INTERNAL_ENGINE_TOKEN: "${APP_INTERNAL_ENGINE_TOKEN:?Set APP_INTERNAL_ENGINE_TOKEN}"
      APP_COOKIE_SECURE: "true"
      GOOGLE_AUTH_ENABLED: "${GOOGLE_AUTH_ENABLED:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "https://${ADEPT_DOMAIN:?Set ADEPT_DOMAIN}/api/v1/auth/google/callback/google"
      GITHUB_INTEGRATION_ENABLED: "${GITHUB_INTEGRATION_ENABLED:-false}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-}"
      GITHUB_APP_PRIVATE_KEY_BASE64: "${GITHUB_APP_PRIVATE_KEY_BASE64:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      JIRA_INTEGRATION_ENABLED: "${JIRA_INTEGRATION_ENABLED:-false}"
      JIRA_CLIENT_ID: "${JIRA_CLIENT_ID:-}"
      JIRA_CLIENT_SECRET: "${JIRA_CLIENT_SECRET:-}"
      JIRA_CALLBACK_URL: "https://${ADEPT_DOMAIN:?Set ADEPT_DOMAIN}/api/v1/integrations/jira/callback"
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:?Set SPRING_MAIL_HOST}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-587}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD}"
      SPRING_MAIL_AUTH: "true"
      SPRING_MAIL_STARTTLS: "true"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [adept]
    logging: *default-logging

  engine-api:
    image: "${ENGINE_IMAGE:?Set ENGINE_IMAGE to an immutable sha-full-commit tag}"
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-adept}"
      POSTGRES_USER: "${POSTGRES_USER:-adept}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [adept]
    logging: *default-logging

  engine-worker:
    image: "${ENGINE_IMAGE:?Set ENGINE_IMAGE to an immutable sha-full-commit tag}"
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-adept}"
      POSTGRES_USER: "${POSTGRES_USER:-adept}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      ENGINE_POLL_INTERVAL_MS: "${ENGINE_POLL_INTERVAL_MS:-1000}"
      ENGINE_WORKER_ID: "${ENGINE_WORKER_ID:?Set ENGINE_WORKER_ID}"
      ENGINE_MAX_JOB_ATTEMPTS: "${ENGINE_MAX_JOB_ATTEMPTS:-8}"
      ENGINE_JOB_LOCK_TIMEOUT_SECONDS: "${ENGINE_JOB_LOCK_TIMEOUT_SECONDS:-900}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_PRIVATE_KEY_BASE64: "${GITHUB_APP_PRIVATE_KEY_BASE64:-}"
      JIRA_CLIENT_ID: "${JIRA_CLIENT_ID:-}"
      JIRA_CLIENT_SECRET: "${JIRA_CLIENT_SECRET:-}"
      APP_INTEGRATION_ENCRYPTION_ACTIVE_KEY_VERSION: "${APP_INTEGRATION_ENCRYPTION_ACTIVE_KEY_VERSION:-1}"
      APP_INTEGRATION_ENCRYPTION_KEY_V1_BASE64: "${APP_INTEGRATION_ENCRYPTION_KEY_V1_BASE64:?Set APP_INTEGRATION_ENCRYPTION_KEY_V1_BASE64}"
      APP_FRONTEND_BASE_URL: "https://${ADEPT_DOMAIN:?Set ADEPT_DOMAIN}"
      SMTP_HOST: "${SMTP_HOST:-${SPRING_MAIL_HOST:-}}"
      SMTP_PORT: "${SMTP_PORT:-${SPRING_MAIL_PORT:-587}}"
      SMTP_USERNAME: "${SMTP_USERNAME:-${SPRING_MAIL_USERNAME:-}}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-${SPRING_MAIL_PASSWORD:-}}"
      APP_EMAIL_FROM: "${APP_EMAIL_FROM:-Adept <no-reply@${ADEPT_DOMAIN}>}"
    networks: [adept]
    logging: *default-logging

  frontend:
    image: "${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable sha-full-commit tag}"
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [adept]
    logging: *default-logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      ADEPT_DOMAIN: "${ADEPT_DOMAIN:?Set ADEPT_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [adept]
    logging: *default-logging

networks:
  adept:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
