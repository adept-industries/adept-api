name: Publish API image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-api-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    # workflow_run also fires for pull-request CI. Publish only a successful
    # push to the protected main branch, using the exact commit that CI tested.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Linux AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/adept-industries/adept-api:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=Adept API
          cache-from: type=gha,scope=adept-api
          cache-to: type=gha,mode=max,scope=adept-api

      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -eu
            cd /opt/adept
            sed -i "s|^API_IMAGE=.*|API_IMAGE=ghcr.io/adept-industries/adept-api:sha-${{ github.event.workflow_run.head_sha }}|" .env.production
            sudo docker compose --env-file .env.production -f compose.yaml pull api
            sudo docker compose --env-file .env.production -f compose.yaml up -d --no-deps api
            sudo docker compose --env-file .env.production -f compose.yaml ps
            curl -fsS https://adeptindustries.dev/actuator/health > /dev/null || curl -fsS https://adeptindustries.dev/api/v1/auth/csrf > /dev/null
            echo "API Deployment Complete!"
