name: Full-stack integration

on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Engine branch, tag, or commit to test
        required: false
        default: main
        type: string
      frontend_ref:
        description: Frontend branch, tag, or commit to test
        required: false
        default: main
        type: string
  pull_request:
    paths:
      - "src/**"
      - "docs/openapi/**"
      - "pom.xml"
      - "scripts/**"
      - "infra/local/compose.yaml"
      - "Dockerfile"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/openapi/**"
      - "pom.xml"
      - "scripts/**"
      - "infra/local/compose.yaml"
      - "Dockerfile"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: adept-phase2-integration

    steps:
      - name: Check out API
        uses: actions/checkout@v6
        with:
          path: adept-api

      - name: Check out engine
        uses: actions/checkout@v6
        with:
          repository: adept-industries/adept-engine
          ref: ${{ inputs.engine_ref || 'main' }}
          path: adept-engine

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: adept-industries/adept-frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: adept-frontend

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: adept-frontend/.nvmrc
          cache: npm
          cache-dependency-path: adept-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: adept-frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: adept-frontend
        run: npx playwright install --with-deps chromium

      - name: Create test-only environment
        shell: bash
        run: |
          cat > .env <<'ENVIRONMENT'
          POSTGRES_HOST=localhost
          POSTGRES_DB=adept
          POSTGRES_USER=adept
          POSTGRES_PASSWORD=ci-only-postgres-password
          POSTGRES_PORT=5432
          APP_JWT_SECRET_BASE64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_TOKEN_HASH_PEPPER_BASE64=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBA=
          APP_INTEGRATION_ENCRYPTION_KEY_V1_BASE64=CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCA=
          APP_INTEGRATION_ENCRYPTION_ACTIVE_KEY_VERSION=1
          APP_INTERNAL_ENGINE_TOKEN=ci-only-engine-token
          APP_COOKIE_SECURE=false
          APP_EMAIL_FROM="Adept CI <test@adept.local>"
          APP_FRONTEND_BASE_URL=http://localhost:3000
          APP_PUBLIC_API_BASE_URL=http://localhost:8080
          APP_ENGINE_BASE_URL=http://localhost:8000
          DB_MAX_POOL_SIZE=10
          DB_MIN_IDLE=2
          GITHUB_INTEGRATION_ENABLED=false
          GITHUB_APP_ID=
          GITHUB_APP_SLUG=
          GITHUB_APP_PRIVATE_KEY_BASE64=
          GITHUB_WEBHOOK_SECRET=
          JIRA_INTEGRATION_ENABLED=false
          JIRA_CLIENT_ID=
          JIRA_CLIENT_SECRET=
          JIRA_CALLBACK_URL=http://localhost:8080/api/v1/integrations/jira/callback
          SPRING_MAIL_USERNAME=
          SPRING_MAIL_PASSWORD=
          SPRING_MAIL_AUTH=false
          SPRING_MAIL_STARTTLS=false
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USERNAME=
          SMTP_PASSWORD=
          ENGINE_POLL_INTERVAL_MS=1000
          ENGINE_WORKER_ID=ci-worker-1
          ENGINE_MAX_JOB_ATTEMPTS=8
          ENVIRONMENT

      - name: Validate Compose
        run: |
          docker compose --env-file .env \
            -f adept-api/infra/local/compose.yaml \
            --profile full config --quiet

      - name: Build and start all six services
        run: |
          docker compose --env-file .env \
            -f adept-api/infra/local/compose.yaml \
            --profile full up -d --build --wait --wait-timeout 180

      - name: Wait for API
        run: |
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 2 --retry-max-time 120 \
            --retry-connrefused --retry-all-errors \
            http://localhost:8080/actuator/health/readiness >/dev/null

      - name: Wait for Mailpit
        run: |
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 2 --retry-max-time 120 \
            --retry-connrefused --retry-all-errors \
            http://localhost:8025/api/v1/info >/dev/null

      - name: Wait for frontend
        run: |
          curl --fail --silent --show-error \
            --retry 60 --retry-delay 2 --retry-max-time 120 \
            --retry-connrefused --retry-all-errors \
            http://localhost:3000/ >/dev/null

      - name: Verify engine readiness and schema version
        run: |
          docker compose --env-file .env \
            -f adept-api/infra/local/compose.yaml \
            exec -T engine-api \
            python -c 'import json, urllib.request; payload = json.load(urllib.request.urlopen("http://localhost:8000/ready", timeout=3)); assert payload == {"status": "READY", "schemaVersion": "9"}, payload'

      - name: Verify PostgreSQL 18 and nine Flyway migrations
        shell: bash
        run: |
          postgres_version_number="$(
            docker compose --env-file .env \
              -f adept-api/infra/local/compose.yaml \
              exec -T postgres sh -c \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SHOW server_version_num;"' \
              | tr -d '[:space:]'
          )"
          postgres_major="$((postgres_version_number / 10000))"
          echo "PostgreSQL major version: $postgres_major"
          test "$postgres_major" = "18"

          migration_count="$(
            docker compose --env-file .env \
              -f adept-api/infra/local/compose.yaml \
              exec -T postgres sh -c \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM flyway_schema_history WHERE success;"' \
              | tr -d '[:space:]'
          )"
          echo "Successful migration count: $migration_count"
          test "$migration_count" = "9"

      - name: Verify migration idempotency after API restart
        shell: bash
        run: |
          docker compose --env-file .env \
            -f adept-api/infra/local/compose.yaml \
            --profile full restart api

          api_ready=false
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "API became ready after restart on attempt $attempt"
              api_ready=true
              break
            fi
            sleep 2
          done
          test "$api_ready" = "true"

          migration_count="$(
            docker compose --env-file .env \
              -f adept-api/infra/local/compose.yaml \
              exec -T postgres sh -c \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) FROM flyway_schema_history WHERE success;"' \
              | tr -d '[:space:]'
          )"
          echo "Migration count after API restart: $migration_count"
          test "$migration_count" = "9"

      - name: Compare committed OpenAPI contracts
        if: github.event_name == 'workflow_dispatch'
        run: |
          cmp --silent \
            adept-api/docs/openapi/adept-api-v1.json \
            adept-frontend/openapi/adept-api-v1.json
          echo "API and frontend OpenAPI contracts match"

      - name: Check generated frontend API types
        working-directory: adept-frontend
        run: npm run api:check

      - name: Run browser acceptance
        working-directory: adept-frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
        run: npx playwright test

      - name: Show service state and safe logs on failure
        if: failure()
        run: |
          docker compose --env-file .env \
            -f adept-api/infra/local/compose.yaml \
            --profile full ps

          docker compose --env-file .env \
            -f adept-api/infra/local/compose.yaml \
            --profile full logs --no-color --tail 200 \
            api engine-api engine-worker frontend postgres

      - name: Stop and remove disposable CI stack
        if: always()
        run: |
          docker compose --env-file .env \
            -f adept-api/infra/local/compose.yaml \
            --profile full down -v --remove-orphans
